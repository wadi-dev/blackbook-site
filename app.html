<!doctype html>
<html lang="en-GB" data-theme="auto" data-density="comfortable" class="app-shell">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://clerk.blackbook.london; connect-src 'self' https://clerk.blackbook.london https://blackbook-london-api.fly.dev; img-src 'self' data: https://img.clerk.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blackbook London</title>
<meta name="description" content="A private, referral-only network.">
<!-- One theme-color, no media query. The page is dark or light by
     daylight.js (a sunset clock, or the member's choice), not by the
     phone's own setting, so a tag that followed the phone would put a
     white status bar over a dark page. daylight.js sets this from the same
     decision that sets the page, so it sits above that script. -->
<meta name="theme-color" content="#FFFFFF" data-light="#FFFFFF" data-dark="#121212">
<script src="assets/daylight.js?v=1791464625"></script>
<link rel="stylesheet" href="assets/app.css?v=1791464625">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blackbook London">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png?v=1791464625">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1791464625">
<link rel="alternate icon" href="favicon.ico?v=1791464625">
<script src="assets/pwa.js?v=1791464625" defer data-install></script>
</head>
<body>

<header class="topbar" id="topbar"></header>
<main id="screen" aria-live="polite"></main>

<!-- Mobile only. Hidden above 860px, where the top nav takes over. -->
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" data-sheet="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="More">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-list"></div>
  </div>
</div>

<!-- Config first, then data and shell. auth.js follows core.js because core.js
     declares BB and auth.js attaches to it. Any script added here must also be
     added to SHELL in sw.js, with a VERSION bump, or the app fails offline. -->
<script src="assets/config.js?v=1791464625"></script>
<script src="assets/data.js?v=1791464625"></script>
<script src="assets/core.js?v=1791464625"></script>
<script src="assets/auth.js?v=1791464625"></script>
<script src="assets/api.js?v=1791464625"></script>
<script src="assets/store.js?v=1791464625"></script>

<!-- D3 v7, vendored from the npm registry rather than loaded from a CDN, so
     the CSP stays 'self' and the Network graph works offline. -->
<script src="assets/vendor/d3.min.js?v=1791464625"></script>

<!-- Screens register themselves on BB.screens -->
<script src="assets/screens/home.js?v=1791464625"></script>
<script src="assets/screens/network.js?v=1791464625"></script>
<script src="assets/screens/asks.js?v=1791464625"></script>
<script src="assets/screens/gives.js?v=1791464625"></script>
<script src="assets/screens/members.js?v=1791464625"></script>
<script src="assets/screens/introductions.js?v=1791464625"></script>
<script src="assets/screens/profile.js?v=1791464625"></script>
<script src="assets/screens/admin.js?v=1791464625"></script>

<!-- Boot last, once every screen exists -->
<script src="assets/boot.js?v=1791464625"></script>

</body>
</html>
