<style>
/* Operator surface, not a member surface. Denser, plainer, and it borrows the
   member design system rather than inventing a second one, so nobody has to
   hold two visual languages in their head. */
.con { max-width: 1180px; margin: 0 auto; padding: 26px 24px 90px; }
.con-head { display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.con-tabs { display: flex; gap: 1px; margin: 0 0 22px; }
.con-tabs button { padding: 8px 14px; border-radius: 8px; font-size: 13.5px;
  font-weight: 600; color: var(--muted); }
.con-tabs button[aria-current="true"] { background: var(--accent); color: var(--surface); }

.m { border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 12px;
  background: var(--surface); }
.m-top { display: flex; gap: 16px; align-items: flex-start; padding: 15px 18px;
  width: 100%; text-align: left; }
.m-score { font-family: var(--font-display); font-weight: 650; font-size: 21px;
  min-width: 42px; font-variant-numeric: tabular-nums; }
.m-body { flex: 1; min-width: 0; }
.m-line { font-size: 14px; line-height: 1.5; }
.m-line b { font-weight: 650; }
.m-why { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.m-why span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: 2px 8px; }
.m-state { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  padding: 4px 10px; border-radius: var(--r-pill); border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; }
.m-state.flight { border-color: var(--accent); color: var(--text); }
.m-state.made { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.m-state.passed { opacity: .5; }
.m.done { opacity: .55; }

.m-open { padding: 0 18px 18px; border-top: 1px solid var(--line); }
.m-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 16px; }
@media (max-width: 720px) { .m-cols { grid-template-columns: 1fr; } }
.m-quote { background: var(--recess); border-radius: 10px; padding: 13px 15px;
  font-size: 13.5px; line-height: 1.55; }
.draft { width: 100%; font: inherit; font-size: 13px; line-height: 1.55;
  background: var(--recess); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; color: var(--text); resize: vertical; }

.stat-row { display: flex; gap: 0; border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; margin-bottom: 22px; }
.stat-row div { flex: 1; padding: 14px 18px; border-right: 1px solid var(--line); }
.stat-row div:last-child { border-right: 0; }
.stat-row b { display: block; font-family: var(--font-display); font-size: 24px;
  font-weight: 650; font-variant-numeric: tabular-nums; }
.stat-row span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); }
</style>
