<!doctype html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://clerk.blackbook.london; connect-src 'self' https://clerk.blackbook.london https://blackbook-london-api.fly.dev; img-src 'self' data: https://img.clerk.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blackbook London: Offline</title>
<link rel="stylesheet" href="assets/app.css?v=1789304631">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blackbook London">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png?v=1789304631">
<style>
  /* Kept inline so the page still reads if app.css is missing from the cache. */
  .offline {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
    text-align: center; gap: 14px;
  }
  .offline img { width: 72px; height: 72px; }
  .offline h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .offline p { max-width: 34ch; margin: 0; line-height: 1.6; color: var(--muted, rgba(0, 0, 0, 0.56)); }
</style>
</head>
<body>

<main class="offline">
  <img src="assets/icons/icon-192.png?v=1789304631" alt="" width="72" height="72">
  <h1>You are offline</h1>
  <p>Blackbook London needs a connection to show anything about members. Nothing is kept on this device, which is the point. Reconnect and open the app again.</p>
  <a class="btn" href="app.html">Try again</a>
</main>

</body>
</html>
