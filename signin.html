<!doctype html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<!-- A meta policy cannot read assets/config.js, so the Clerk host is written
     here by hand. clerk.blackbook.london is the production Frontend API.
     Against a development instance, swap in its <slug>.clerk.accounts.dev host
     in both script-src and connect-src, on every page. docs/clerk.md has what
     each directive costs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://large-ladybug-4111.clerk.accounts.dev; connect-src 'self' https://large-ladybug-4111.clerk.accounts.dev https://blackbook-london-api.fly.dev; img-src 'self' data: https://img.clerk.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blackbook London: Sign in</title>
<!-- One theme-color, no media query. The page is dark or light by
     daylight.js (a sunset clock, or the member's choice), not by the
     phone's own setting, so a tag that followed the phone would put a
     white status bar over a dark page. daylight.js sets this from the same
     decision that sets the page, so it sits above that script. -->
<meta name="theme-color" content="#FFFFFF" data-light="#FFFFFF" data-dark="#0A0A0A">
<script src="assets/daylight.js?v=1791386077"></script>
<link rel="stylesheet" href="assets/app.css?v=1791386077">
<link rel="stylesheet" href="assets/landing.css?v=1791386077">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blackbook London">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png?v=1791386077">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1791386077">
<link rel="alternate icon" href="favicon.ico?v=1791386077">
<script src="assets/pwa.js?v=1791386077" defer></script>
</head>
<body class="lp lp-centre">

<header class="lp-bar">
  <a class="wordmark" href="index.html">Blackbook<span class="geo">(London)</span></a>
  <a class="btn sm" href="index.html">Back</a>
</header>

<main class="lp-doc lp-enter">
  <h1>Sign in.</h1>
  <p class="lead">
    Sign in with a code sent to your email address.
    There are no passwords.
  </p>

  <!-- Clerk's SignIn component is mounted here by assets/auth.js. -->
  <div id="signin"></div>
  <p id="signin-msg" class="small" role="status" aria-live="polite"></p>

  <hr class="lp-rule">

  <p class="small muted">
    Membership is by invitation. If you have a code, it goes on the
    <a href="enter.html">invitation page</a>, not here.
  </p>
</main>

<footer class="lp-foot">
  <div>
    <span class="wordmark">Blackbook<span class="geo">(London)</span></span>
    <p class="small muted">London. By referral only.</p>
  </div>
  <nav class="small">
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms of membership</a>
    <a href="index.html">Home</a>
  </nav>
</footer>

<script src="assets/config.js?v=1791386077"></script>
<script src="assets/auth.js?v=1791386077"></script>

</body>
</html>
