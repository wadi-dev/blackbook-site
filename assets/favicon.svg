<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The book from the app icon, cut for 16 pixels: a closed cover, its
       spine, and the bookmark. Ink on nothing, so it sits on any tab strip;
       the ink turns white when the browser chrome is dark. -->
  <style>
    .ink { fill: #0A0A0A; }
    .cut { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #FFFFFF; }
      .cut { fill: #0A0A0A; }
    }
  </style>
  <rect class="ink" x="6" y="3" width="20" height="26" rx="3"/>
  <rect class="cut" x="9.5" y="6" width="1.2" height="20" rx="0.6"/>
  <path class="cut" d="M19 3h4v9.5l-2-2-2 2z"/>
</svg>
